name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    # WPF targets net10.0-windows, so this cannot run on ubuntu.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CurrencyConverter.slnx

      - name: Build
        run: dotnet build CurrencyConverter.slnx -c Release --no-restore
